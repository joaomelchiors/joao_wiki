<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" role="img" aria-label="Relação entre agentes, skills e MCPs ou CLIs">
<style>
text{font-family:'Segoe UI',system-ui,sans-serif}
.svg-ink{fill:#1d2520}.svg-muted{fill:#5b6660}.svg-acc{fill:#0e7a5f}
.svg-box{fill:#fff;stroke:#dde2dc}.svg-boxacc{fill:#e3f0ea;stroke:#0e7a5f}
.svg-lineacc{stroke:#0e7a5f;fill:none}
.svg-t{font-size:12px}.svg-tb{font-size:12.5px;font-weight:600}
.svg-m{font-family:Consolas,ui-monospace,monospace;font-size:10.5px}
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e7a5f"/></marker>
</defs>
<rect x="40" y="60" width="180" height="90" rx="10" class="svg-boxacc"/>
<text x="130" y="92" text-anchor="middle" class="svg-tb svg-acc">Agent</text>
<text x="130" y="114" text-anchor="middle" class="svg-t svg-ink">especialista com papel</text>
<text x="130" y="132" text-anchor="middle" class="svg-t svg-ink">e personalidade; executa</text>
<rect x="280" y="60" width="180" height="90" rx="10" class="svg-box"/>
<text x="370" y="92" text-anchor="middle" class="svg-tb svg-ink">Skill</text>
<text x="370" y="114" text-anchor="middle" class="svg-t svg-muted">SOP / workflow que</text>
<text x="370" y="132" text-anchor="middle" class="svg-t svg-muted">o agente segue</text>
<rect x="520" y="60" width="180" height="90" rx="10" class="svg-box"/>
<text x="610" y="92" text-anchor="middle" class="svg-tb svg-ink">MCP / CLI</text>
<text x="610" y="114" text-anchor="middle" class="svg-t svg-muted">ferramentas que a</text>
<text x="610" y="132" text-anchor="middle" class="svg-t svg-muted">skill manda chamar</text>
<line x1="220" y1="105" x2="274" y2="105" class="svg-lineacc" stroke-width="2" marker-end="url(#arrA)"/>
<text x="247" y="92" text-anchor="middle" class="svg-m svg-muted">segue</text>
<line x1="460" y1="105" x2="514" y2="105" class="svg-lineacc" stroke-width="2" marker-end="url(#arrA)"/>
<text x="487" y="92" text-anchor="middle" class="svg-m svg-muted">chama</text>
<text x="370" y="188" text-anchor="middle" class="svg-t svg-muted">um agente pode ter várias skills; cada skill pode orquestrar vários MCPs/CLIs</text>
</svg>
