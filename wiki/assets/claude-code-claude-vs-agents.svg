<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-label="Relação entre as pastas .claude e .agents">
<style>
text{font-family:'Segoe UI',system-ui,sans-serif}
.svg-ink{fill:#1d2520}.svg-muted{fill:#5b6660}.svg-acc{fill:#0e7a5f}
.svg-box{fill:#fff;stroke:#dde2dc}.svg-boxacc{fill:#e3f0ea;stroke:#0e7a5f}
.svg-lineacc{stroke:#0e7a5f;fill:none}
.svg-t{font-size:12px}.svg-tb{font-size:12.5px;font-weight:600}
.svg-m{font-family:Consolas,ui-monospace,monospace;font-size:10.5px}
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e7a5f"/></marker>
</defs>
<rect x="30" y="30" width="290" height="170" rx="10" class="svg-box"/>
<text x="50" y="58" class="svg-tb svg-ink">.claude/</text>
<text x="50" y="78" class="svg-m svg-muted">específico do Claude Code</text>
<rect x="50" y="92" width="250" height="36" rx="7" class="svg-box"/>
<text x="62" y="115" class="svg-m svg-ink">settings.json  → config local</text>
<rect x="50" y="138" width="250" height="36" rx="7" class="svg-boxacc"/>
<text x="62" y="161" class="svg-m svg-ink">skills/vercel-react… → referência ⤳</text>
<rect x="410" y="30" width="280" height="170" rx="10" fill="#fff" stroke="#0e7a5f" stroke-width="2"/>
<text x="430" y="58" class="svg-tb svg-acc">.agents/</text>
<text x="430" y="78" class="svg-m svg-muted">universal: vale p/ qualquer agente</text>
<rect x="430" y="92" width="240" height="36" rx="7" class="svg-boxacc"/>
<text x="442" y="115" class="svg-m svg-ink">skills/vercel-react… ← fonte real</text>
<rect x="430" y="138" width="240" height="36" rx="7" class="svg-box"/>
<text x="442" y="161" class="svg-m svg-ink">SKILL.md: nome, descrição, regras</text>
<path d="M 300 156 C 350 156 360 110 404 110" class="svg-lineacc" stroke-dasharray="5 4" marker-end="url(#arr3)"/>
<text x="360" y="216" text-anchor="middle" class="svg-t svg-muted">a skill em .claude é só um atalho; a fonte de verdade mora em .agents</text>
</svg>
